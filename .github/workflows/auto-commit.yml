```yaml
name: Daily Auto Commit

on:
  schedule:
    - cron: '0 12 * * *'  # 5:30 PM IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Make random commits
        run: |
          git config user.email "devendhiran0508@gmail.com"
          git config user.name "Devendhiran"

          COUNT=$(( RANDOM % 6 + 1 ))

          echo "Today's commit count: $COUNT"

          for i in $(seq 1 $COUNT); do
            echo "Update $i at $(date)" >> activity.log

            git add activity.log
            git commit -m "Daily activity update $i"
          done

          git push
```
